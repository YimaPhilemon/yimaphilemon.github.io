<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Yima Philemon</title>
	<!-- Applies the stored theme before first paint, so the page can never flash
	     the wrong one. Kept inline and tiny for that reason. -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('yp_theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) { /* private mode: fall through to the system preference */ }
		})();
	</script>

  <link rel="icon" type="image/svg+xml" href="/files/favicon.svg" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" type="text/css" href="/files/main_style.css" />
  <script>
    // Elevven11 Studio moved to its own domain. Anything under the old
    // /elevven11-studio/ path (including sub-pages we no longer host,
    // e.g. /elevven11-studio/pricing/) redirects there, preserving the
    // rest of the path, query string, and hash.
    (function () {
      var prefix = '/elevven11-studio/';
      var path = window.location.pathname;
      if (path.indexOf(prefix) === 0) {
        var rest = path.slice(prefix.length);
        var target = 'https://elevven11studio.github.io/' + rest + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <header>
    <div class="container navbar">
      <a href="/" class="logo">YIMA PHILEMON</a>
      <ul class="nav-links">
        <li class="nav-item"><a href="/">Home</a></li>
        <li class="nav-item"><a href="/gallery/">Gallery</a></li>
        <li class="nav-item"><a href="/contact/">Contact</a></li>
      </ul>
			<button class="theme-toggle" type="button" aria-label="Switch colour theme">
				<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
				<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
			</button>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <section class="hero" style="min-height: 100vh;">
    <div class="hero-content container">
      <h1 class="hero-title" style="font-size: 3rem;">Page Not <strong>Found</strong></h1>
      <p class="hero-tagline" style="font-size: 1.15rem;">
        Looking for Elevven11 Studio? It's moved to
        <a href="https://elevven11studio.github.io/" style="color: var(--accent-cyan);">elevven11studio.github.io</a>.
      </p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">Back to Home</a>
      </div>
    </div>
  </section>

  <script src="/files/portfolio.js"></script>
</body>
</html>
